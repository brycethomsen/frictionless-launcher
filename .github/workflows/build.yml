# Builds the release binaries natively on each OS, smoke-tests each one by
# starting it for real, and packages them into the archives a release
# publishes (uploaded as the "release" artifact). Not triggered directly:
# ci.yml runs it on every PR as a dry run, so a release-only break (packaging,
# goreleaser, an action bump) shows up before a tag does; release.yml runs it
# for real and publishes the result.
name: Build

on:
  workflow_call:
    inputs:
      release:
        description: Build a tagged release (false = snapshot dev build)
        type: boolean
        default: false

# goreleaser is pinned so its own releases can't change the build between a
# green PR and a tag. Bump it here deliberately.
env:
  GORELEASER_VERSION: v2.19.0

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # setup-go keys its cache on OS + Go version + this file list, not
          # the job, so naming this workflow keeps the test and build jobs'
          # caches apart: their compiler flags differ, and sharing one key
          # meant whichever job saved first left the other recompiling Fyne.
          cache-dependency-path: |
            go.sum
            .github/workflows/build.yml

      # The Fyne build dependencies, plus a virtual display, GL software
      # rendering and a D-Bus session for the smoke test.
      - name: Install Fyne Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev xvfb libgl1-mesa-dri dbus-x11

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      # --snapshot is required on non-release runs: goreleaser build
      # otherwise requires HEAD to be exactly at a release tag.
      - name: Build linux binaries
        shell: bash
        run: |
          set -euo pipefail
          args="build --id linux --clean"
          if [ "${{ inputs.release }}" != "true" ]; then
            args="$args --snapshot"
          fi
          goreleaser $args

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          export SMOKE_BINARY="$PWD/$(find dist -type f -name 'Frictionless-Launcher' -path '*linux*' | head -1)"
          xvfb-run -a dbus-run-session -- go test -tags smoke -count=1 -v ./internal/smoke/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Windows Defender's real-time scanning makes Go/cgo builds dramatically
      # slower on windows-latest. Safe here — these are single-use, ephemeral
      # runner VMs, not a persistent machine.
      - name: Disable Windows Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # setup-go keys its cache on OS + Go version + this file list, not
          # the job, so naming this workflow keeps the test and build jobs'
          # caches apart: their compiler flags differ, and sharing one key
          # meant whichever job saved first left the other recompiling Fyne.
          cache-dependency-path: |
            go.sum
            .github/workflows/build.yml

      - name: Install MinGW
        run: choco install mingw -y

      # The runner has no GPU, and Windows' built-in OpenGL is 1.1, below
      # what Fyne needs. Mesa's software renderer lets the smoke test open
      # real windows.
      - name: Install Mesa OpenGL (for the smoke test)
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Build windows binaries
        shell: bash
        run: |
          set -euo pipefail
          args="build --id windows --clean"
          if [ "${{ inputs.release }}" != "true" ]; then
            args="$args --snapshot"
          fi
          goreleaser $args

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          export SMOKE_BINARY="$PWD/$(find dist -type f -name 'Frictionless-Launcher.exe' -path '*windows*' | head -1)"
          go test -tags smoke -count=1 -v ./internal/smoke/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*

  build-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # setup-go keys its cache on OS + Go version + this file list, not
          # the job, so naming this workflow keeps the test and build jobs'
          # caches apart: their compiler flags differ, and sharing one key
          # meant whichever job saved first left the other recompiling Fyne.
          cache-dependency-path: |
            go.sum
            .github/workflows/build.yml

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true

      - name: Build darwin binaries
        shell: bash
        run: |
          set -euo pipefail
          args="build --id darwin --clean"
          if [ "${{ inputs.release }}" != "true" ]; then
            args="$args --snapshot"
          fi
          goreleaser $args

      # A bare binary shows up in Finder as "Unix Executable File" and
      # double-click opens it through Terminal.app instead of launching it
      # silently — wrap it as a real .app bundle. Has to happen here, not in
      # the package job, since sips/iconutil/codesign are macOS-only tools.
      - name: Build macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ inputs.release }}" != "true" ]; then
            version="0.0.0-dev"
          fi
          bin=$(find dist -type f -name 'Frictionless-Launcher' -path '*darwin_all*' | head -1)
          ./packaging/macos/build-app.sh "$bin" dist "$version"
          ditto -c -k --keepParent dist/Frictionless-Launcher.app dist/Frictionless-Launcher_Darwin_universal.zip

      # Tests the signed binary from inside the bundle that gets shipped.
      # Tray only: GitHub's Apple-silicon macOS runners are GPU-less VMs
      # with no OpenGL, so no Fyne window can open here. The window modes
      # are covered on Linux and Windows, and by `make smoke` on a real Mac.
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          export SMOKE_NO_OPENGL=1
          export SMOKE_BINARY="$PWD/dist/Frictionless-Launcher.app/Contents/MacOS/Frictionless-Launcher"
          go test -tags smoke -count=1 -v ./internal/smoke/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-darwin
          path: dist/Frictionless-Launcher_Darwin_universal.zip

  package:
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    steps:
      # goreleaser's `release` command has no OSS way to skip rebuilding and
      # package pre-built binaries instead (that's a Pro-only feature), so
      # this job packages the artifacts from the three native build jobs
      # directly rather than invoking goreleaser again.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Package archives and checksums
        run: |
          set -euo pipefail
          mkdir -p release

          linux_bin=$(find dist -type f -name 'Frictionless-Launcher' -path '*linux*' | head -1)
          darwin_zip=$(find dist -type f -name 'Frictionless-Launcher_Darwin_universal.zip' | head -1)
          windows_bin=$(find dist -type f -name 'Frictionless-Launcher.exe' -path '*windows*' | head -1)

          if [ -z "$linux_bin" ] || [ -z "$darwin_zip" ] || [ -z "$windows_bin" ]; then
            echo "missing an expected build artifact:"
            echo "  linux:   ${linux_bin:-MISSING}"
            echo "  darwin:  ${darwin_zip:-MISSING}"
            echo "  windows: ${windows_bin:-MISSING}"
            find dist -type f
            exit 1
          fi

          # actions/upload-artifact + download-artifact can strip the
          # executable bit off Unix binaries during their zip round-trip —
          # restore it before archiving, or the published binary fails with
          # "permission denied" on Linux. The darwin .app bundle was already
          # assembled, signed, and zipped in build-darwin (needs macOS-only
          # tools), so it just needs copying into place here.
          chmod +x "$linux_bin"

          tar -C "$(dirname "$linux_bin")" -czf release/Frictionless-Launcher_Linux_x86_64.tar.gz Frictionless-Launcher
          cp "$darwin_zip" release/Frictionless-Launcher_Darwin_universal.zip
          (cd "$(dirname "$windows_bin")" && zip -j "$GITHUB_WORKSPACE/release/Frictionless-Launcher_Windows_x86_64.zip" Frictionless-Launcher.exe)

          cd release && sha256sum *.tar.gz *.zip > checksums.txt

      # Check what a user would actually download: every archive opens and
      # holds the executable, with its executable bit where it needs one.
      - name: Verify archives
        run: |
          set -euo pipefail
          cd release
          sha256sum -c checksums.txt
          tar -tvzf Frictionless-Launcher_Linux_x86_64.tar.gz | grep -E '^-rwx.* Frictionless-Launcher$'
          unzip -l Frictionless-Launcher_Windows_x86_64.zip | grep -q 'Frictionless-Launcher.exe'
          unzip -l Frictionless-Launcher_Darwin_universal.zip | grep -q 'Frictionless-Launcher.app/Contents/MacOS/Frictionless-Launcher'
          unzip -l Frictionless-Launcher_Darwin_universal.zip | grep -q 'Frictionless-Launcher.app/Contents/Info.plist'

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/*
