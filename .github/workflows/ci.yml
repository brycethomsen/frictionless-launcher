name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # A full release build and smoke test of every binary, without publishing.
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: false

  # The one check the main branch ruleset requires: it passes only if every
  # job above did. Requiring this instead of each job by name means adding
  # or renaming jobs doesn't silently drop them from what gates a merge.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job did not succeed: ${{ toJSON(needs) }}"
            exit 1
          fi

  dependabot-auto-merge:
    runs-on: ubuntu-latest
    needs: [ci-passed]
    # Only run on Dependabot PRs after all checks pass
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Allowlisted by dependency group, not just semver level: the "fyne"
      # group (see dependabot.yml) covers a GUI framework this app is deeply
      # integrated with. Its PRs always wait for manual review, even on a
      # patch bump; the rendered snapshots in internal/ui and the smoke
      # tests in build.yml are what that review starts from.
      # --auto hands the merge to GitHub, which still waits for the
      # ruleset's required check.
      - name: Auto-merge patch and minor updates in the safe dependency groups
        if: |
          (steps.meta.outputs.dependency-group == 'go-dependencies-safe' ||
           steps.meta.outputs.dependency-group == 'github-actions') &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
